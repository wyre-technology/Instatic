name: Wyre Release

# Builds and publishes this fork's wyre-release integration branch to WYRE's
# own GHCR namespace. Separate from upstream release.yml (tag-triggered,
# publishes to ghcr.io/corebunch/instatic) so our internal patch branch
# never collides with CoreBunch's own release process or image tags.

on:
  push:
    branches:
      - wyre-release
  # Manual trigger. Push-only meant the sole way to exercise this pipeline was
  # to land a commit on the release branch, which makes diagnosing a
  # runner-environment failure (one that reproduces in CI but not locally)
  # needlessly destructive. Keep the button.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Lint
        run: bun run lint

  image:
    name: Publish GHCR Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image metadata
        id: version
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/wyre-technology/instatic:latest
            ghcr.io/wyre-technology/instatic:${{ steps.version.outputs.sha_short }}
          build-args: |
            INSTATIC_VERSION=wyre-${{ steps.version.outputs.sha_short }}
            INSTATIC_REVISION=${{ github.sha }}
            INSTATIC_CREATED=${{ steps.version.outputs.created }}
