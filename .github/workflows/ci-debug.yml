name: CI Debug

on:
  push:
    branches:
      - 'ci-debug/**'
  workflow_dispatch:

jobs:
  debug:
    name: Debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner image metadata
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          cat /imagegeneration/imagedata.json 2>/dev/null | head -60 || true
          echo "nproc=$(nproc)"
          node --version || true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Isolated test (no build)
        continue-on-error: true
        run: bun test src/__tests__/canvas/canvasFormControls.test.tsx

      - name: Build
        run: bun run build

      - name: Isolated test (after build)
        continue-on-error: true
        run: bun test src/__tests__/canvas/canvasFormControls.test.tsx

      - name: Full suite
        continue-on-error: true
        run: bun test
