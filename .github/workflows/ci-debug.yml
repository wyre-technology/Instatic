name: CI Debug

# Temporary verification harness for the canvasFormControls cross-file leak.
# Lives only on ci-debug/** branches so it never runs for anything else, and is
# deleted once the fix has landed on wyre-release.

on:
  push:
    branches:
      - 'ci-debug/**'
  workflow_dispatch:

jobs:
  verify:
    name: Verify (same sequence as wyre-release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner image metadata
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          echo "nproc=$(nproc)"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Lint
        run: bun run lint

  control:
    name: Control (pre-fix commit, expected red)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout pre-fix commit
        uses: actions/checkout@v4
        with:
          ref: cc6ecfdd16cf5d26807efdb0f4f235f5a618f068

      - name: Runner image metadata
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test (records the pre-fix result on this same image)
        continue-on-error: true
        run: bun test
