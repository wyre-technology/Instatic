name: Wyre Debug

on:
  push:
    branches:
      - 'wyre/ci-repro-**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner facts
        run: |
          echo "IMAGE=$ImageOS $ImageVersion"
          echo "nproc=$(nproc)"
          uname -a
          cat /etc/os-release | head -3
          node --version || true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Bun version
        run: bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test (single file, isolated)
        id: isolated
        continue-on-error: true
        run: bun test src/__tests__/canvas/canvasFormControls.test.tsx 2>&1 | tail -120

      - name: Test (canvas dir)
        id: canvasdir
        continue-on-error: true
        run: bun test src/__tests__/canvas 2>&1 | tail -160

      - name: Test (full suite)
        id: full
        continue-on-error: true
        run: bun test 2>&1 | grep -E '\[diag\]|canvasFormControls|tests failed|pass$|fail$|Ran [0-9]+ tests|\(fail\)' | tail -200

      - name: Outcomes
        run: |
          echo "isolated=${{ steps.isolated.outcome }}"
          echo "canvasdir=${{ steps.canvasdir.outcome }}"
          echo "full=${{ steps.full.outcome }}"
