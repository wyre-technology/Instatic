name: Wyre Debug

on:
  push:
    branches:
      - 'wyre/ci-repro-**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner facts
        run: |
          echo "IMAGE=$ImageOS $ImageVersion"
          echo "nproc=$(nproc)"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test (canvas dir, no build)
        id: canvasdir
        continue-on-error: true
        run: |
          set -o pipefail
          bun test src/__tests__/canvas 2>&1 | grep -E '\[diag\]|tests failed|Ran [0-9]+ tests|\(fail\)|error:'

      - name: Test (single file, isolated)
        id: isolated
        continue-on-error: true
        run: |
          set -o pipefail
          bun test src/__tests__/canvas/canvasFormControls.test.tsx 2>&1 | grep -E '\[diag\]|tests failed|Ran [0-9]+ tests|\(fail\)|error:'

      - name: Outcomes
        run: |
          echo "canvasdir=${{ steps.canvasdir.outcome }}"
          echo "isolated=${{ steps.isolated.outcome }}"
